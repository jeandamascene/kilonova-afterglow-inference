[build-system]
requires      = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name        = "kilonova-afterglow-inference"
version     = "0.1.0"
description = "Bayesian inference of kilonova lightcurve parameters from multiwavelength photometry"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.10"

authors = [
    { name = "Jean", email = "mbjdamas@gmail.com" },
]

keywords = [
    "astrophysics", "kilonova", "gravitational waves",
    "multimessenger", "bayesian inference", "GW170817",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "astropy>=5.3",
    "bilby>=2.1",
    "dynesty>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]

[project.urls]
Homepage      = "https://gitlab.com/Jean-damas/kilonova-afterglow-inference"
Repository    = "https://gitlab.com/Jean-damas/kilonova-afterglow-inference"
Documentation = "https://kilonova-afterglow-inference.readthedocs.io"
"Bug Tracker" = "https://gitlab.com/Jean-damas/kilonova-afterglow-inference/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length    = 88
target-version = "py310"
select         = ["E", "F", "W", "I", "N"]
ignore         = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
